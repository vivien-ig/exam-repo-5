
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Corrected CloudFormation template to deploy an EC2 instance
  with a security group.

Parameters:

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
    Description: EC2 instance type.


  AMIId:
    Type: AWS::EC2::Image::Id
    Default: ami-0bf6dbeae330f5823
    Description: Amazon Linux 2023 AMI ID for ca-central-1.
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Select an existing VPC.

  
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for SSH access.

  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access SSH. Restrict to your IP/32.

Resources:

  # Security group
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH access to EC2
      VpcId: !Ref VpcId

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation

      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-security-group"

  # EC2 instance
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMIId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName

      
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-instance"

Outputs:

  InstanceId:
    Description: ID of the EC2 instance
    Value: !Ref EC2Instance

  PublicIP:
    Description: Public IP address of the EC2 instance
    Value: !GetAtt EC2Instance.PublicIp

  SecurityGroupId:
    Description: ID of the EC2 security group
    Value: !Ref InstanceSecurityGroup
